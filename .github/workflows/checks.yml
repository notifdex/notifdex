name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build -c release
      - run: bash tools/build-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Notifdex.app dist/Notifdex-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Notifdex-macOS-arm64
          path: dist/Notifdex-macOS-arm64.zip
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - run: TLA_JAR="$RUNNER_TEMP/tla2tools.jar" bash tools/check-model.sh
      - run: python3 -m unittest discover -s tests -v
