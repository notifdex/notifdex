name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Smoke-test notifdex-capture CLI and flock exclusion
        run: |
          notifdex_bin="$(swift build -c release --show-bin-path)"
          "$notifdex_bin/notifdex-capture" --help | grep -q "notifdex-capture"
          if "$notifdex_bin/notifdex-capture" --unknown-flag >/dev/null 2>&1; then
            echo "Expected unknown CLI flag to fail" >&2
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python3 -c '
          import fcntl, os, subprocess, sys
          db = sys.argv[1]
          bin_path = sys.argv[2]
          lock = open(db + ".lock", "w+")
          fcntl.flock(lock.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
          proc = subprocess.run([bin_path, "--db", db, "--source", "ci-test", "--app", "X"], capture_output=True, text=True)
          assert proc.returncode != 0, f"expected flock failure, got {proc.returncode}"
          assert "Another collector owns this database" in (proc.stdout + proc.stderr), proc.stdout + proc.stderr
          lock.close()
          ' "$tmp_dir/capture.db" "$notifdex_bin/notifdex-capture"
        timeout-minutes: 2
      - name: Package native app and check resources
        run: bash tools/build-app.sh
        timeout-minutes: 3
      - name: Smoke-test menu bar startup and shutdown
        run: bash tools/smoke-app.sh
        timeout-minutes: 2
      - name: Package universal app
        run: NOTIFDEX_UNIVERSAL=1 bash tools/build-app.sh
        timeout-minutes: 10
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Notifdex.app dist/Notifdex-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Notifdex-macOS-universal
          path: dist/Notifdex-macOS-universal.zip
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify TLC
        run: |
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - run: TLA_JAR="$RUNNER_TEMP/tla2tools.jar" bash tools/check-model.sh
      - run: python3 -m unittest discover -s contract-tests -v
