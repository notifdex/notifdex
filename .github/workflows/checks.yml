name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build -c release
      - name: Package native app and check resources
        run: bash tools/build-app.sh
        timeout-minutes: 3
      - name: Smoke-test menu bar startup and shutdown
        run: dist/Notifdex.app/Contents/MacOS/Notifdex --smoke-test
        timeout-minutes: 2
      - name: Package universal app
        run: NOTIFDEX_UNIVERSAL=1 bash tools/build-app.sh
        timeout-minutes: 10
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Notifdex.app dist/Notifdex-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Notifdex-macOS-universal
          path: dist/Notifdex-macOS-universal.zip
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - run: TLA_JAR="$RUNNER_TEMP/tla2tools.jar" bash tools/check-model.sh
      - run: python3 -m unittest discover -s tests -v
