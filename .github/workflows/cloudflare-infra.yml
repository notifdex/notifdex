name: Cloudflare infrastructure

on:
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/cloudflare-infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/cloudflare-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "OpenTofu operation (plan uses read-only credentials; apply requires main + protected cloudflare-prod approval)"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      confirm_commit:
        description: "For apply: exact 7+ character commit SHA prefix reviewed in the plan"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-infra
  cancel-in-progress: false

jobs:
  validate:
    name: OpenTofu fmt & validate (unprivileged)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Check formatting
        run: tofu fmt -check -recursive
      - name: Initialize without backend
        run: tofu init -backend=false -input=false
      - name: Validate configuration
        run: tofu validate

  plan:
    name: OpenTofu plan (trusted main)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-plan
    defaults:
      run:
        working-directory: infra/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Verify required configuration
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || (echo "Missing CLOUDFLARE_PLAN_API_TOKEN secret" && exit 1)
          test -n "${AWS_ACCESS_KEY_ID}" || (echo "Missing R2_STATE_ACCESS_KEY_ID secret" && exit 1)
          test -n "${AWS_SECRET_ACCESS_KEY}" || (echo "Missing R2_STATE_SECRET_ACCESS_KEY secret" && exit 1)
          test -n "${TF_VAR_cloudflare_account_id}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID variable" && exit 1)
          test -n "${TF_VAR_zone_id}" || (echo "Missing CLOUDFLARE_ZONE_ID variable" && exit 1)
      - name: Initialize R2 remote state backend
        env:
          TF_STATE_R2_BUCKET: ${{ vars.TF_STATE_R2_BUCKET }}
          TF_STATE_R2_KEY: ${{ vars.TF_STATE_R2_KEY }}
        run: |
          BUCKET="${TF_STATE_R2_BUCKET:-notifdex-tfstate}"
          KEY="${TF_STATE_R2_KEY:-cloudflare/terraform.tfstate}"
          tofu init -input=false \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=${KEY}" \
            -backend-config="region=auto" \
            -backend-config="use_lockfile=true" \
            -backend-config="endpoints={s3=\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"
      - name: Run plan for commit ${{ github.sha }}
        run: |
          echo "Planning commit: ${GITHUB_SHA}"
          tofu plan -input=false -no-color

  apply:
    name: OpenTofu apply (protected main)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    defaults:
      run:
        working-directory: infra/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_APPLY_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed commit SHA
        env:
          CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
        run: |
          if [ "${#CONFIRM_COMMIT}" -lt 7 ]; then
            echo "Refusing apply: supply confirm_commit with at least 7 characters of the reviewed main commit SHA."
            exit 1
          fi
          case "${GITHUB_SHA}" in
            "${CONFIRM_COMMIT}"*)
              echo "Confirmed commit SHA prefix ${CONFIRM_COMMIT} matches ${GITHUB_SHA}"
              ;;
            *)
              echo "Refusing apply: confirm_commit (${CONFIRM_COMMIT}) does not match checkout (${GITHUB_SHA})."
              exit 1
              ;;
          esac
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Initialize R2 remote state backend
        env:
          TF_STATE_R2_BUCKET: ${{ vars.TF_STATE_R2_BUCKET }}
          TF_STATE_R2_KEY: ${{ vars.TF_STATE_R2_KEY }}
        run: |
          BUCKET="${TF_STATE_R2_BUCKET:-notifdex-tfstate}"
          KEY="${TF_STATE_R2_KEY:-cloudflare/terraform.tfstate}"
          tofu init -input=false \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=${KEY}" \
            -backend-config="region=auto" \
            -backend-config="use_lockfile=true" \
            -backend-config="endpoints={s3=\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"
      - name: Plan and apply reviewed commit
        run: |
          tofu plan -input=false -no-color -out=tfplan
          tofu apply -input=false -no-color tfplan
      - name: Remove ephemeral plan file
        if: always()
        run: rm -f tfplan
