name: Release macOS app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.0)"
        required: true
        type: string
      draft:
        description: "Publish GitHub Release as a draft (skips Homebrew tap push)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and monotonic build number
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            is_draft="false"
          else
            version="${INPUT_VERSION#v}"
            is_draft="${INPUT_DRAFT:-false}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          build_number="$(git rev-list --count HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${is_draft}" >> "$GITHUB_OUTPUT"
          echo "Resolved release v${version} (build ${build_number}, draft=${is_draft})"

      - name: Verify required signing and notarization secrets
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -z "$CERT_P12" ]] && missing+=("APPLE_DEVELOPER_ID_CERT_P12_BASE64")
          [[ -z "$CERT_PASS" ]] && missing+=("APPLE_DEVELOPER_ID_CERT_PASSWORD")
          [[ -z "$TEAM_ID" ]] && missing+=("APPLE_TEAM_ID")
          [[ -z "$NOTARY_KEY" ]] && missing+=("APPLE_NOTARY_KEY_P8_BASE64")
          [[ -z "$NOTARY_KEY_ID" ]] && missing+=("APPLE_NOTARY_KEY_ID")
          [[ -z "$NOTARY_ISSUER_ID" ]] && missing+=("APPLE_NOTARY_ISSUER_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            echo "See docs/release-signing.md for the one-time Apple Developer setup." >&2
            exit 1
          fi

      - name: Run Swift tests and strict release check
        run: |
          swift test
          swift build -c release -Xswiftc -warnings-as-errors

      - name: Import Developer ID Application certificate into temporary keychain
        id: keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain_path="$RUNNER_TEMP/notifdex-signing.keychain-db"
          keychain_pass="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12_path"
          chmod 600 "$p12_path"

          security create-keychain -p "$keychain_pass" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_pass" "$keychain_path"

          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | grep "Developer ID Application:" \
            | grep "(${APPLE_TEAM_ID})" \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"

          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application certificate found for Team ID ${APPLE_TEAM_ID}." >&2
            security find-identity -v -p codesigning "$keychain_path" >&2 || true
            exit 1
          fi

          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "keychain_path=${keychain_path}" >> "$GITHUB_OUTPUT"
          rm -f "$p12_path"

      - name: Build and sign universal Notifdex.app
        env:
          NOTIFDEX_UNIVERSAL: "1"
          NOTIFDEX_VERSION: ${{ steps.meta.outputs.version }}
          NOTIFDEX_BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          NOTIFDEX_SIGNING_IDENTITY: ${{ steps.keychain.outputs.identity }}
          NOTIFDEX_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/build-app.sh

      - name: Smoke-test signed app startup and shutdown
        run: bash tools/smoke-app.sh

      - name: Notarize, staple, and verify with Gatekeeper
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          submit_zip="$RUNNER_TEMP/Notifdex-notary-submit.zip"
          notary_json="$RUNNER_TEMP/notary-result.json"

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          ditto -c -k --sequesterRsrc --keepParent dist/Notifdex.app "$submit_zip"

          set +e
          xcrun notarytool submit "$submit_zip" \
            --key "$key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$notary_json"
          submit_rc=$?
          set -e

          cat "$notary_json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$notary_json" 2>/dev/null || true)"
          submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$notary_json" 2>/dev/null || true)"

          if [[ "$submit_rc" -ne 0 || "$status" != "Accepted" ]]; then
            echo "Notarization failed (status=${status:-unknown}, rc=${submit_rc}). Fetching log..." >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$key_path" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" >&2 || true
            fi
            exit 1
          fi

          xcrun stapler staple dist/Notifdex.app
          xcrun stapler validate dist/Notifdex.app
          spctl --assess --type execute --verbose=4 dist/Notifdex.app

      - name: Package stapled universal zip, SHA-256, and Homebrew cask
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          archive="dist/Notifdex-${VERSION}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Notifdex.app "$archive"
          sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$(basename "$archive")" > "${archive}.sha256"
          bash tools/render-homebrew-cask.sh "$VERSION" "$sha256" dist/notifdex.rb

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_DRAFT: ${{ steps.meta.outputs.is_draft }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SHA256_FILE: ${{ steps.package.outputs.sha256_file }}
        run: |
          draft_args=()
          if [[ "$IS_DRAFT" == "true" ]]; then
            draft_args+=(--draft)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$SHA256_FILE" dist/notifdex.rb --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$SHA256_FILE" dist/notifdex.rb \
              --title "Notifdex ${VERSION}" \
              --generate-notes \
              "${draft_args[@]}"
          fi

      - name: Update notifdex/homebrew-tap cask
        if: ${{ steps.meta.outputs.is_draft != 'true' && secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ssh_dir="$RUNNER_TEMP/tap-ssh"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh-keyscan -t ed25519 github.com > "$ssh_dir/known_hosts" 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ${ssh_dir}/id_ed25519 -o UserKnownHostsFile=${ssh_dir}/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          git clone git@github.com:notifdex/homebrew-tap.git "$tap_dir"
          mkdir -p "$tap_dir/Casks"
          cp dist/notifdex.rb "$tap_dir/Casks/notifdex.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Homebrew tap cask already up to date for ${VERSION}."
          else
            git add Casks/notifdex.rb
            git commit -m "notifdex ${VERSION}"
            git push origin HEAD
          fi

      - name: Print release summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
          IS_DRAFT: ${{ steps.meta.outputs.is_draft }}
        run: |
          {
            echo "## Notifdex ${VERSION}"
            echo ""
            echo "- **SHA-256:** \`${SHA256}\`"
            echo "- **Install via Homebrew:** \`brew install --cask notifdex/tap/notifdex\`"
            echo "- **Upgrade via Homebrew:** \`brew upgrade --cask notifdex\`"
            if [[ "$IS_DRAFT" == "true" || "$HAS_TAP_KEY" != "true" ]]; then
              echo ""
              echo "> Note: \`notifdex/homebrew-tap\` was not pushed automatically (draft=${IS_DRAFT}, HOMEBREW_TAP_DEPLOY_KEY set=${HAS_TAP_KEY})."
              echo "> The rendered \`Casks/notifdex.rb\` is attached to the release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/notifdex-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/tap-ssh"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/Notifdex-notary-submit.zip"
