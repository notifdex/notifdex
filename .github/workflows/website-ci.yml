name: Website checks

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Build & verify static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static site
        run: npm run build
      - name: Run website verification checks
        run: npm run check
